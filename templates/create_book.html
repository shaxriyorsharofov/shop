<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Book</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    background:linear-gradient(135deg,#4f46e5,#2563eb,#06b6d4);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

}

.container{

    width:550px;

    background:white;

    border-radius:25px;

    padding:40px;

    box-shadow:0 20px 40px rgba(0,0,0,.2);

}

h1{

    text-align:center;

    color:#2563eb;

    margin-bottom:30px;

}

.menu{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-bottom:30px;

}

.menu a{

    text-decoration:none;

    color:white;

    background:#2563eb;

    padding:10px 20px;

    border-radius:10px;

    transition:.3s;

}

.menu a:hover{

    background:#1d4ed8;

    transform:translateY(-3px);

}

input{

    width:100%;

    padding:15px;

    margin-bottom:18px;

    border:none;

    outline:none;

    background:#f1f5f9;

    border-radius:12px;

    font-size:16px;

    transition:.3s;

}

input:focus{

    background:white;

    border:2px solid #2563eb;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(90deg,#22c55e,#16a34a);

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:translateY(-4px);

    box-shadow:0 10px 20px rgba(34,197,94,.4);

}

.footer{

    text-align:center;

    margin-top:20px;

    color:#666;

}

</style>

</head>

<body>

<div class="container">

<h1>📚 Add New Book</h1>

<div class="menu">

<a href="{% url 'home' %}">🏠 Home</a>

<a href="{% url 'list' %}">📖 Books</a>

</div>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="name"
placeholder="📘 Book Name"
required>

<input
type="text"
name="author"
placeholder="👤 Author"
required>

<input
type="text"
name="type_janr"
placeholder="🏷️ Genre"
required>

<input
type="number"
name="price"
placeholder="💰 Price"
required>

<input
type="number"
name="quantity"
placeholder="📦 Quantity"
required>

<input
type="text"
name="desc"
placeholder="📝 Description"
required>

<button type="submit">
💾 Save Book
</button>

</form>

<div class="footer">

Library Management System

</div>

</div>

</body>

</html>
