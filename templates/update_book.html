<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Kitobni O'zgartirish</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:#0f172a;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            color:white;
        }

        /* Animatsiyali fon */

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(59,130,246,.15);
            animation:float 12s ease-in-out infinite;
        }

        .circle:nth-child(1){
            width:250px;
            height:250px;
            left:-80px;
            top:-80px;
        }

        .circle:nth-child(2){
            width:180px;
            height:180px;
            right:-60px;
            bottom:-60px;
            animation-duration:15s;
        }

        .circle:nth-child(3){
            width:120px;
            height:120px;
            left:25%;
            bottom:10%;
            animation-duration:9s;
        }

        @keyframes float{
            50%{
                transform:translateY(-25px) scale(1.1);
            }
        }

        .container{
            position:relative;
            z-index:1;
            width:550px;
            max-width:92%;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.45);
        }

        h2{
            text-align:center;
            color:#38bdf8;
            margin-bottom:30px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#1e293b;
            color:white;
            outline:none;
            font-size:15px;
        }

        textarea{
            min-height:120px;
            resize:vertical;
        }

        input:focus,
        textarea:focus,
        select:focus{
            border:2px solid #38bdf8;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
            margin-top:25px;
        }

        .btn{
            text-decoration:none;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .save{
            background:#2563eb;
            color:white;
        }

        .save:hover{
            background:#1d4ed8;
            transform:translateY(-3px);
        }

        .back{
            background:#475569;
            color:white;
        }

        .back:hover{
            background:#334155;
            transform:translateY(-3px);
        }

    </style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

    <h2>📖 Kitobni O'zgartirish</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="buttons">

            <button type="submit" class="btn save">
                💾 Saqlash
            </button>

            <a href="{% url 'detail' book.id %}" class="btn back">
                ↩️ Ortga
            </a>

        </div>

    </form>

</div>

</body>
</html>
