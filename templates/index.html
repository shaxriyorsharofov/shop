<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#4f46e5,#7c3aed,#2563eb);

}

.container{

    width:900px;

    padding:70px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border-radius:25px;

    text-align:center;

    color:white;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

}

h1{

    font-size:60px;

    margin-bottom:20px;

}

p{

    font-size:20px;

    line-height:35px;

    margin-bottom:50px;

    opacity:.9;

}

.buttons{

    display:flex;

    justify-content:center;

    gap:25px;

}

.buttons a{

    text-decoration:none;

    color:white;

    padding:18px 35px;

    border-radius:15px;

    font-size:20px;

    font-weight:bold;

    transition:.3s;

}

.book{

    background:#06b6d4;

}

.book:hover{

    background:#0891b2;

    transform:translateY(-5px);

}

.add{

    background:#22c55e;

}

.add:hover{

    background:#15803d;

    transform:translateY(-5px);

}

</style>

</head>

<body>

<div class="container">

<h1>📚 Library Management</h1>

<p>

Manage your books with a beautiful and modern library system.

Create books, view details and organize your collection easily.

</p>

<div class="buttons">

<a class="book" href="{% url 'list' %}">
📖 View Books
</a>

<a class="add" href="{% url 'create_book' %}">
➕ Add Book
</a>

</div>

</div>

</body>

</html>
