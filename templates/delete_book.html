<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Book</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.container{
    width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h1{
    color:#dc2626;
    margin-bottom:20px;
}

p{
    font-size:20px;
    color:#555;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    background:#dc2626;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#b91c1c;
    transform:translateY(-3px);
}

a{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 30px;
    border-radius:10px;
    transition:.3s;
}

a:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

</style>

</head>

<body>

<div class="container">

<h1>🗑 Delete Book</h1>

<p>
Are you sure you want to delete
<b>"{{ book.name }}"</b>?
</p>

<form method="POST">

{% csrf_token %}

<div class="buttons">

<button type="submit">
Yes, Delete
</button>

<a href="{% url 'list' %}">
Cancel
</a>

</div>

</form>

</div>

</body>
</html>
